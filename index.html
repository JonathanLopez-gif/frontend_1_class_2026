<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>RGBA COLOR</title>
  </head>

  <body>

    <div class="main-container">

      <div class="internal-container">

        <h1>Crea tus propios colores</h1>

        <div class="color">
          <label for="red">R</label>
          <input id="red" type="range" min="0" max="255" value="127" step="1">
          <p id="red-text"></p>
        </div>

        <div class="color">
          <label for="green">G</label>
          <input id="green" type="range" min="0" max="255" value="127" step="1">
          <p id="green-text"></p>
        </div>

        <div class="color">
          <label for="blue">B</label>
          <input id="blue" type="range" min="0" max="255" value="127" step="1">
          <p id="blue-text"></p>
        </div>

        <div class="color">
          <label for="alpha">A</label>
          <input id="alpha" type="range" min="0" max="1" value="0.5" step="0.1">
          <p id="alpha-text"></p>
        </div>

      </div>

    </div>

    <script src="rgba.js"></script>
    
  </body>

</html>
